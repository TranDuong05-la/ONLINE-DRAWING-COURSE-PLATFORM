spring:
  config:
    activate:
      on-profile: mysql-course-v13-it
  datasource:
    url: ${MYSQL_IT_URL}
    username: ${MYSQL_IT_USERNAME}
    password: ${MYSQL_IT_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET SESSION innodb_lock_wait_timeout=10
      maximum-pool-size: 8
  flyway:
    enabled: true
    target: 13
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
