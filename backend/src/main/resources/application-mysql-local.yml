spring:
  config:
    activate:
      on-profile: mysql-local
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/drawing_course_it
    username: ${MYSQL_IT_USERNAME:}
    password: ${MYSQL_IT_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: false
    clean-disabled: true
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    test-connection: false
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false
app:
  payment:
    vnpay:
      return-url: ${VNPAY_RETURN_URL:http://10.0.2.2:8080/api/payments/vnpay/return}
      allow-local-http-return-url: ${VNPAY_ALLOW_LOCAL_HTTP_RETURN:true}
