server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: Art Academy API

  config:
    import: optional:file:.env[.properties]

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

  # Upload ảnh bìa / video / PDF của phần khóa học (giới hạn chi tiết từng loại kiểm tra trong code)
  servlet:
    multipart:
      # Video bài học tối đa 2GB (giới hạn từng loại file kiểm tra thêm trong LocalFileStorageService: ảnh 5MB, pdf 20MB).
      # max-request-size lớn hơn một chút vì request còn gồm phần đầu multipart.
      # Spring ghi file tạm ra đĩa (không giữ trong RAM). Mặc định thư mục tạm của hệ điều hành (thường ở ổ C:):
      # đặt UPLOAD_TMP_DIR để chuyển sang ổ còn nhiều chỗ, cùng ổ với thư mục upload thì file được chuyển nhanh hơn.
      max-file-size: 2GB
      max-request-size: 2100MB
      location: ${UPLOAD_TMP_DIR:}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp

app:
  seed:
    enabled: ${SEED_DATA_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
  google:
    client-id: ${GOOGLE_CLIENT_ID:631102057997-3ebr6ea99bpulk4isu1g3if2jj2fp9si.apps.googleusercontent.com}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME:${cloudinary.cloud_name:}}
  api_key: ${CLOUDINARY_API_KEY:${cloudinary.api_key:}}
  api_secret: ${CLOUDINARY_API_SECRET:${cloudinary.api_secret:}}
