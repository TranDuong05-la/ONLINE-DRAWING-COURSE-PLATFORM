server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: Art Academy API

  config:
    import: optional:file:.env[.properties]

  flyway:
    enabled: false

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

  # Upload ảnh bìa / video / PDF của B và ảnh bài nộp của C (giới hạn chi tiết từng loại kiểm tra trong code)
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp

app:
  # General Cart requires the Product/stock projection and remains separately gated.
  cart:
    api-enabled: ${CART_API_ENABLED:false}
    # Course-only Cart uses B's sellable catalog and C's ownership/claim reads; disabled by default.
    course-only:
      api-enabled: ${COURSE_ONLY_CART_API_ENABLED:false}
  checkout:
    # Product Checkout composes the existing Course claims, trusted E catalog, inventory and explicit shipping policy.
    # Both flags remain off by default; the HTTP route has an additional independent gate.
    product:
      enabled: ${PRODUCT_CHECKOUT_ENABLED:false}
      http-enabled: ${PRODUCT_CHECKOUT_HTTP_ENABLED:false}
    shipping:
      flat-fee-vnd: ${PRODUCT_SHIPPING_FLAT_FEE_VND:}
    course-only:
      enabled: ${COURSE_ONLY_CHECKOUT_ENABLED:false}
      http-enabled: ${COURSE_ONLY_CHECKOUT_HTTP_ENABLED:false}
      catalog-adapter:
        enabled: ${COURSE_ONLY_CHECKOUT_CATALOG_ADAPTER_ENABLED:false}
  voucher:
    api-enabled: ${VOUCHER_API_ENABLED:false}
    admin-api-enabled: ${VOUCHER_ADMIN_API_ENABLED:false}
  payment:
    vnpay:
      enabled: ${VNPAY_ENABLED:false}
      session-api:
        enabled: ${VNPAY_SESSION_API_ENABLED:false}
      ipn:
        enabled: ${VNPAY_IPN_ENABLED:false}
      query-dr:
        enabled: ${VNPAY_QUERY_DR_ENABLED:false}
        ip-address: ${VNPAY_QUERY_DR_IP_ADDRESS:}
      payment-url: ${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      tmn-code: ${VNPAY_TMN_CODE:}
      secret-key: ${VNPAY_SECRET_KEY:}
      return-url: ${VNPAY_RETURN_URL:}
      ipn-url: ${VNPAY_IPN_URL:}
      allow-local-http-return-url: ${VNPAY_ALLOW_LOCAL_HTTP_RETURN:false}
      api-version: ${VNPAY_API_VERSION:2.1.0}
      command: ${VNPAY_COMMAND:pay}
    settlement:
      enabled: ${PAYMENT_SETTLEMENT_ENABLED:false}
      worker:
        enabled: ${PAYMENT_SETTLEMENT_WORKER_ENABLED:false}
        worker-id: ${PAYMENT_SETTLEMENT_WORKER_ID:course-settlement-worker}
        batch-size: ${PAYMENT_SETTLEMENT_WORKER_BATCH_SIZE:16}
        scheduler:
          enabled: ${PAYMENT_SETTLEMENT_SCHEDULER_ENABLED:false}
          initial-delay-ms: ${PAYMENT_SETTLEMENT_SCHEDULER_INITIAL_DELAY_MS:10000}
          fixed-delay-ms: ${PAYMENT_SETTLEMENT_SCHEDULER_FIXED_DELAY_MS:10000}
  order:
    expiration:
      enabled: ${ORDER_EXPIRATION_ENABLED:false}
      scheduler:
        enabled: ${ORDER_EXPIRATION_SCHEDULER_ENABLED:false}
        batch-size: ${ORDER_EXPIRATION_BATCH_SIZE:100}
        initial-delay-ms: ${ORDER_EXPIRATION_SCHEDULER_INITIAL_DELAY_MS:15000}
        fixed-delay-ms: ${ORDER_EXPIRATION_SCHEDULER_FIXED_DELAY_MS:60000}
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
  # ---- B: file upload của admin lưu trên ổ đĩa server, phục vụ ở /uploads/** ----
  upload:
    dir: ${UPLOAD_DIR:uploads}
    # C: ảnh bài nộp tối đa 5MB (JPEG/PNG)
    max-image-bytes: 5242880
  # ---- B: dữ liệu mẫu chỉ nạp khi bảng còn trống. Mặc định tắt; profile h2 bật (xem application-h2.yaml) ----
  supply:
    dev-orders:
      enabled: ${SUPPLY_DEV_ORDERS_ENABLED:false}
  seed:
    enabled: ${SEED_ENABLED:false}
    users:
      enabled: false
  # ---- C: học tập, bài nộp, chứng nhận ----
  storage:
    # Ảnh bài nộp và file PDF chứng nhận: lưu riêng tư (không phục vụ công khai như /uploads)
    root: ${APP_STORAGE_ROOT:./storage}
  learning:
    # Xem đủ 90% thời lượng video thì bài học được tính là hoàn thành
    complete-ratio: 0.9
  certificate:
    email-max-attempts: 5
    email-cooldown-seconds: 300
    # Link tải trong app (mở bằng trình xem PDF) và link gửi trong email
    download-link-ttl-seconds: 300
    email-link-ttl-seconds: 604800
  # Địa chỉ đưa vào link tải chứng nhận (10.0.2.2 = máy host khi chạy Android emulator)
  public-base-url: ${PUBLIC_BASE_URL:http://10.0.2.2:8080}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
