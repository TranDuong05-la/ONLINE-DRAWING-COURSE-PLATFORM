server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: Art Academy API

  config:
    import: optional:file:.env[.properties]

  flyway:
    enabled: false

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp

app:
  payment:
    vnpay:
      enabled: ${VNPAY_ENABLED:false}
      ipn:
        enabled: ${VNPAY_IPN_ENABLED:false}
      payment-url: ${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      tmn-code: ${VNPAY_TMN_CODE:}
      secret-key: ${VNPAY_SECRET_KEY:}
      return-url: ${VNPAY_RETURN_URL:}
      ipn-url: ${VNPAY_IPN_URL:}
      api-version: ${VNPAY_API_VERSION:2.1.0}
      command: ${VNPAY_COMMAND:pay}
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
